name: Dopmin Cloud Scraper

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "URL to scrape"
        required: true
        type: string
      job_id:
        description: "Job id generated by the bridge, used by the desktop app to poll for this run's results"
        required: false
        type: string

jobs:
  scrape:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Execute Scraper
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          python scrape_task.py "${{ github.event.inputs.target_url }}" "${{ github.event.inputs.job_id }}"
